<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polio Vaccination | Form Configurator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/apk.css?v=205">
<style>
  body { font-family: 'Public Sans', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  /* Phone preview scales to fill available height, never gets clipped or
     forces a scrollbar. aspect-ratio + max-width/max-height (both 100%)
     is the CSS "contain" pattern: browser shrinks whichever dimension is
     tighter while preserving the phone's proportions. */
  .phone-frame {
    height: 100%;
    max-height: 660px;
    width: auto;
    max-width: 100%;
    aspect-ratio: 340 / 660;
  }
</style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex flex-col">

  <!-- Top bar -->
  <header class="flex items-center justify-between px-4 py-3 bg-gray-500 text-white flex-shrink-0">
    <button class="flex items-center gap-2 text-sm font-medium bg-white text-[#c2410c] px-3 py-1.5 rounded-md hover:bg-gray-50">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back To Modules
    </button>
    <div class="text-base">
      <span id="module-title" class="font-semibold"></span>
      <span id="module-version" class="text-gray-200 text-sm ml-1"></span>
    </div>
    <div class="w-24"></div> <!-- spacer to balance layout -->
  </header>

  <!-- Body -->
  <div class="flex flex-1 min-h-0 overflow-hidden">

    <!-- Left nav rail -->
    <nav class="w-24 bg-white border-r border-gray-200 flex-shrink-0 py-4 flex flex-col items-center gap-1">
      <button data-rail="flows" class="rail-item w-20 flex flex-col items-center gap-1 py-2.5 rounded-md text-xs">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none"><path d="M3 10a7 7 0 1114 0 7 7 0 01-14 0z" stroke="currentColor" stroke-width="1.4"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Flows
      </button>
      <button data-rail="form-elements" class="rail-item w-20 flex flex-col items-center gap-1 py-2.5 rounded-md text-xs">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="12" width="14" height="4" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="leading-tight text-center">Form<br/>Elements</span>
      </button>
      <button data-rail="roles" class="rail-item w-20 flex flex-col items-center gap-1 py-2.5 rounded-md text-xs">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M4 17c0-3 2.7-5 6-5s6 2 6 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Roles
      </button>
    </nav>

    <!-- Flows panel -->
    <aside id="flows-panel" class="w-72 bg-white border-r border-gray-200 flex-shrink-0 overflow-y-auto px-4 py-4"></aside>

    <!-- Placeholder for non-flows rail items -->
    <div id="nav-placeholder" class="hidden flex-1 overflow-y-auto"></div>

    <!-- Workspace: tabs + canvas + properties -->
    <div id="workspace" class="flex flex-1 min-h-0 overflow-hidden">
      <div class="flex-1 min-h-0 flex flex-col overflow-hidden">
        <div id="tabs-row" class="flex items-center gap-2 px-4 pt-3 pb-2 border-b border-gray-200 bg-gray-50 flex-shrink-0 overflow-x-auto"></div>
        <div class="flex-1 min-h-0 overflow-hidden flex justify-center gap-4 px-6 py-4">
          <button id="nav-prev" class="self-center w-9 h-9 rounded-full border border-gray-300 flex items-center justify-center text-gray-500 hover:bg-gray-100 flex-shrink-0" aria-label="Previous screen">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="canvas" class="min-h-0 flex items-center justify-center"></div>
          <button id="nav-next" class="self-center w-9 h-9 rounded-full border border-gray-300 flex items-center justify-center text-gray-500 hover:bg-gray-100 flex-shrink-0" aria-label="Next screen">
            <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="default-preview-caption" class="flex-shrink-0 text-center text-xs text-gray-400 pb-3 px-6">
          You&rsquo;re viewing the default preview. Scroll or select an element in Page Properties to start exploring it.
        </div>
      </div>

      <aside id="properties-panel" class="w-80 bg-white border-l border-gray-200 flex-shrink-0 overflow-y-auto px-5 py-5"></aside>
    </div>
  </div>

  <!-- Bottom action bar -->
  <footer class="flex items-center justify-between px-4 py-3 bg-white border-t border-gray-200 flex-shrink-0">
    <button id="open-flows" class="text-sm text-gray-500 hover:text-gray-700">Open Flows panel</button>
    <button id="save-config" class="flex items-center gap-2 bg-[#c2410c] text-white text-sm font-medium px-4 py-2 rounded-md hover:bg-[#a8380a]">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Save Configuration
    </button>
  </footer>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 right-6 bg-gray-900 text-white text-sm px-4 py-2 rounded-md shadow-lg opacity-0 translate-y-2 transition-all"></div>

  <script src="assets/js/data.js?v=205"></script>
  <script src="assets/js/app.js?v=205"></script>
</body>
</html>
